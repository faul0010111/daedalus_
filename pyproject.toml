[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus-agentic"
version = "0.1.0"
description = "A self-directed architecture for persistent agentic intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
daedalus = "daedalus.cli:main"

[tool.setuptools.packages.find]
include = ["daedalus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
